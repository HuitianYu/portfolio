baseURL: "https://huitianyu.netlify.app/"
locale: en-us
title: Huitian Yu
enableRobotsTXT: true
disableKinds: [taxonomy, term]
params:
  portrait: "images/profile/huitian-yu-portrait.jpeg"
  portraitLocation: "Paris, France"
  description: "Crystallization, control and scientific computing — research and interactive labs by Huitian Yu."
  email: "martin.huitian.yu@gmail.com"
  cvURL: "https://drive.google.com/file/d/1Y_QN1DArzY0SakEJqA6-pp44uDHgU2tA/view?usp=sharing"
  wikiURL: "https://huitianyu.github.io/"
menu:
  main:
    - {name: Home, url: /, weight: 10}
    - {name: Papers, url: /papers/, weight: 20}
    - {name: Conferences, url: /conferences/, weight: 30}
    - {name: Labs, url: /labs/, weight: 40}
    - {name: Wiki, url: /wiki/, weight: 50}
    - {name: News, url: /news/, weight: 60}
    - {name: CV, url: /cv/, weight: 70}
    - {name: Contact, url: /contact/, weight: 80}
    - {name: Search, url: /search/, weight: 90}
outputs:
  home: [HTML, RSS, JSON]
markup:
  goldmark:
    renderer:
      unsafe: false

# Remove obsolete output files when a Lab bundle is moved away.
build:
  cleanDestinationDir:
    enable: true

# Track shared UI assets as build dependencies, including during local preview.
module:
  mounts:
    - {source: content, target: content}
    - {source: data, target: data}
    - {source: layouts, target: layouts}
    - {source: static, target: static}
    - {source: static, target: assets}
