<div class="card-actions">
  <a href="{{ .primaryURL }}">{{ .primaryLabel }}</a>
  {{ with .relatedURL }}
    {{ $external := or (hasPrefix . "https://") (hasPrefix . "http://") }}
    <a
      href="{{ . }}"
      {{ with $.relatedTitle }}aria-label="{{ . }}"{{ end }}
    >
      {{ $.relatedLabel }}{{ if $external }}{{ partial "external-link-mark.html" . }}{{ end }}
    </a>
  {{ end }}
</div>
